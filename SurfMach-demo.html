document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

p: 12px;\n}\n.brand-mark{\n  width: 36px; height: 36px;\n  border: 1px solid var(--line-hi);\n  background: var(--bg-1);\n  display: grid;\n  place-items: center;\n  position: relative;\n}\n.brand-mark::before, .brand-mark::after{\n  content:\"\"; position: absolute;\n  background: var(--accent);\n}\n.brand-mark::before{ top: 8px; bottom: 8px; left: 50%; width: 1px; transform: translateX(-.5px); opacity:.4 }\n.brand-mark::after{ left: 8px; right: 8px; top: 50%; height: 1px; transform: translateY(-.5px); opacity:.4 }\n.brand-mark svg{ position: relative; z-index: 1; }\n.brand-text{\n  display: flex; flex-direction: column; line-height: 1;\n}\n.brand-text .name{\n  font-family: var(--mono);\n  font-weight: 700;\n  letter-spacing: .12em;\n  font-size: 16px;\n  text-transform: uppercase;\n}\n.brand-text .sub{\n  font-size: 10px;\n  letter-spacing: .25em;\n  color: var(--fg-2);\n  text-transform: uppercase;\n  margin-top: 4px;\n}\n\n.hud-coord{\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 4px;\n  font-size: 10.5px;\n  color: var(--fg-2);\n  letter-spacing: .12em;\n  text-transform: uppercase;\n}\n.hud-coord .row{ display:flex; gap: 12px; }\n.hud-coord .row span b{ color: var(--fg-0); font-weight: 600; letter-spacing: .05em; }\n\n/* ============ ZOOM-LEVEL LADDER (top-right) ============ */\n.zoom-ladder{\n  position: absolute;\n  right: 18px; top: 54px;\n  z-index: 560;\n  display: flex; flex-direction: column;\n  background: var(--bg-1);\n  border: 1px solid var(--line);\n  padding: 4px;\n  gap: 2px;\n}\n.zoom-ladder button{\n  font-family: var(--mono);\n  background: transparent;\n  border: 1px solid transparent;\n  color: var(--fg-2);\n  padding: 5px 12px 5px 9px;\n  font-size: 9px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  cursor: pointer;\n  text-align: left;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  min-width: 100px;\n}\n.zoom-ladder button .dot{\n  width: 5px; height: 5px;\n  border: 1px solid var( osition: absolute; top:0; bottom:0; width:1px; background: var(--line-hi);\n}\n.scale-bar::before{ left: 33%; }\n.scale-bar::after{ left: 66%; }\n\n/* ============ LEAFLET OVERRIDES ============ */\n.leaflet-container{\n  background: #06101a !important;\n  font-family: var(--mono);\n  cursor: crosshair;\n}\n.leaflet-control-attribution{\n  background: rgba(14,24,34,.85) !important;\n  color: var(--fg-2) !important;\n  font-size: 9px !important;\n  letter-spacing: .05em;\n  border: 1px solid var(--line);\n  border-right: none; border-bottom: none;\n}\n.leaflet-control-attribution a{ color: var(--fg-1) !important; }\n.leaflet-control-zoom{\n  border: 1px solid var(--line) !important;\n  box-shadow: none !important;\n}\n.leaflet-control-zoom a{\n  background: var(--bg-1) !important;\n  color: var(--fg-1) !important;\n  border-bottom: 1px solid var(--line) !important;\n  font-family: var(--mono);\n}\n.leaflet-control-zoom a:hover{\n  background: var(--bg-2) !important;\n  color: var(--fg-0) !important;\n}\n\n/* ============ MARKERS ============ */\n.sm-marker{\n  position: relative;\n  display: grid;\n  place-items: center;\n}\n.sm-marker .pulse{\n  position: absolute; inset: 0;\n  border-radius: 50%;\n  border: 1px solid currentColor;\n  opacity: 0;\n  animation: pulse 2.8s infinite;\n}\n@keyframes pulse{\n  0%{ transform: scale(.6); opacity: .9; }\n  100%{ transform: scale(2.4); opacity: 0; }\n}\n.sm-marker .core{\n  width: 12px; height: 12px;\n  border-radius: 50%;\n  background: currentColor;\n  border: 1.5px solid rgba(255,255,255,.85);\n  box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 0 12px currentColor;\n}\n.sm-marker.consistent{ color: var(--accent); }\n.sm-marker.occasional{ color: var(--warn); }\n.sm-marker.easter-egg{ color: #ffcf4a; }\n.sm-marker.easter-egg .core{\n  width: 14px; height: 14px;\n  border-radius: 0;\n  background: transparent;\n  border: none;\n  box-shadow: none;\n  font-size: 14px;\n  display: grid; place-items: center;\n  filter: drop-shadow(0 0 kground: rgba(10,17,25,.9);\n  border: 1px solid var(--zc, var(--line-hi));\n  padding: 4px 9px;\n  white-space: nowrap;\n  cursor: pointer;\n  pointer-events: auto;\n  transition: background .15s, transform .15s;\n  box-shadow: 0 2px 10px rgba(0,0,0,.4);\n}\n.zone-pill:hover{ background: var(--bg-2); transform: translateY(-1px); }\n.zone-pill .zp-dot{\n  width: 8px; height: 8px;\n  background: var(--zc);\n  box-shadow: 0 0 8px var(--zc);\n  flex-shrink: 0;\n}\n.zone-pill .zp-name{\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--fg-0);\n}\n\n/* ============ ZONE DOCK (condiciones desplegables, esquina) ============ */\n#zone-dock{\n  position: absolute;\n  top: 76px; right: 18px;\n  z-index: 560;\n  width: 264px;\n  background: var(--bg-1);\n  border: 1px solid var(--line);\n  box-shadow: 0 10px 40px rgba(0,0,0,.5);\n  display: none;\n}\n#zone-dock.visible{ display: block; }\n.dock-head{\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 10px 12px;\n  border-bottom: 1px solid var(--line);\n  background: var(--bg-2);\n}\n.dock-title{\n  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;\n  color: var(--fg-1); font-weight: 700;\n}\n.dock-toggle{\n  background: transparent; border: 1px solid var(--line-hi);\n  color: var(--fg-2); cursor: pointer;\n  width: 22px; height: 22px; line-height: 1; font-size: 11px;\n}\n.dock-toggle:hover{ color: var(--fg-0); border-color: var(--fg-1); }\n.dock-body{ max-height: min(62vh, 560px); overflow-y: auto; }\n.dock-body.hidden{ display: none; }\n.dock-body::-webkit-scrollbar{ width: 5px; }\n.dock-body::-webkit-scrollbar-thumb{ background: var(--line-hi); }\n\n.dock-zone{ border-bottom: 1px solid var(--line); }\n.dock-zone:last-child{ border-bottom: none; }\n.dock-zone.active{ background: rgba(61,168,255,.05); }\n.dz-head{\n  width: 100%;\n  display: grid;\n  grid-template-columns: 12px 1fr auto auto;\n  align-items: center; gap: 9px;\n  background: transparent; border: none;\n  padding: 10px 12px;\n  cursor: pointer;\n  font-family: var(--sans);\n  border-left: 2px solid transparent;\n}\n.dock-zone.active .dz-head{ border-left-color: var(--zc); }\n.dz-head:hover{ background: var(--bg-2); }\n.dz-dot{\n  width: 9px; height: 9px;\n  background: var(--zc);\n  box-shadow: 0 0 7px var(--zc);\n}\n.dz-name{\n  text-align: left;\n  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;\n  font-weight: 600; color: var(--fg-0);\n}\n.dz-n{\n  font-size: 9.5px; color: var(--fg-2);\n  background: var(--bg-0); border: 1px solid var(--line);\n  padding: 1px 6px;\n}\n.dz-chev{ color: var(--fg-3); font-size: 10px; }\n.dz-body{\n  display: none;\n  padding: 0 12px 12px 23px;\n}\n.dock-zone.open .dz-body{ display: block; }\n.dz-row{\n  display: grid; grid-template-columns: 52px 1fr;\n  gap: 8px; font-size: 10.5px; margin-bottom: 4px;\n}\n.dz-row .k{ color: var(--fg-2); letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; align-self: center; }\n.dz-row .v{ color: var(--fg-0); }\n.dz-summary{\n  font-size: 10.5px; color: var(--fg-1);\n  line-height: 1.5; margin-top: 8px;\n  padding-top: 8px; border-top: 1px dashed var(--line);\n}\n.dz-enter{\n  margin-top: 10px;\n  width: 100%;\n  background: var(--bg-0);\n  border: 1px solid var(--line-hi);\n  color: var(--fg-1);\n  font-family: var(--sans);\n  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;\n  padding: 7px; cursor: pointer;\n}\n.dz-enter:hover{ color: var(--fg-0); border-color: var(--zc); }\n\n/* ============ PANEL DERECHO ============ */\n.panel{\n  background: var(--bg-1);\n  border-left: 1px solid var(--line);\n  display: flex; flex-direction: column;\n  overflow: hidden;\n  height: 100vh;\n  min-width: 0;\n}\n\n.panel-search{\n  padding: 14px 16px;\n  border-bottom: 1px solid var(--line);\n  background: var(--bg-1);\n}\n.search-box{\n  display: flex; align-items: center;\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  padding: 0 10px;\n  height: 36px;\n  transition: border-color .15s;\n}\n.search-box:focus-within{ border-color: var(--accent); }\n.search-box svg{ flex-shrink: 0; opacity: .6; }\n.search-box input{\n  background: transparent;\n  border: none; outline: none;\n  flex: 1;\n  font-family: var(--mono);\n  color: var(--fg-0);\n  font-size: 12px;\n  padding: 0 10px;\n}\n.search-box input::placeholder{ color: var(--fg-3); letter-spacing: .05em; }\n.search-clear{\n  background: transparent;\n  border: 1px solid var(--line);\n  color: var(--fg-2);\n  padding: 2px 6px;\n  cursor: pointer;\n  font-family: var(--mono);\n  font-size: 10px;\n}\n.search-results{\n  margin-top: 8px;\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  max-height: 220px;\n  overflow-y: auto;\n}\n.search-results:empty{ display: none; }\n.search-results .hit{\n  padding: 8px 12px;\n  border-bottom: 1px solid var(--line);\n  cursor: pointer;\n  display: flex; align-items: center; gap: 10px;\n}\n.search-results .hit:last-child{ border-bottom: none; }\n.search-results .hit:hover{ background: var(--bg-2); }\n.search-results .hit .name{ font-size: 12px; flex: 1; }\n.search-results .hit .meta{ font-size: 10px; color: var(--fg-2); letter-spacing: .05em; text-transform: uppercase; }\n\n.filters{\n  display: flex;\n  gap: 6px;\n  margin-top: 10px;\n  flex-wrap: wrap;\n}\n.filter-chip{\n  font-family: var(--mono);\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  color: var(--fg-2);\n  padding: 4px 10px;\n  font-size: 10px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  cursor: pointer;\n}\n.filter-chip.active{\n  background: var(--accent-soft);\n  border-color: var(--accent);\n  color: var(--fg-0);\n}\n.filter-chip:hover{ color: var(--fg-0); }\n\n/* Breadcrumb */\n.breadcrumb{\n  padding: 10px 16px;\n  border-bottom: 1px solid var(--line);\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 10px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--fg-2);\n  flex-wrap: wrap;\n  background: var(--bg-2);\n}\n.breadcrumb .crumb{\n  cursor: pointer;\n  padding: 2px 4px;\n}\n.breadcrumb .crumb:hover{ color: var(--fg-0); }\n.breadcrumb .crumb.current{ color: var(--fg-0); cursor: default; }\n.breadcrumb .sep{ color: var(--fg-3); }\n\n.panel-body{\n  flex: 1;\n  overflow-y: auto;\n  padding: 16px;\n}\n.panel-body::-webkit-scrollbar{ width: 6px; }\n.panel-body::-webkit-scrollbar-track{ background: var(--bg-1); }\n.panel-body::-webkit-scrollbar-thumb{ background: var(--line-hi); }\n\n/* ============ SECTIONS ============ */\n.section-title{\n  font-size: 10px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--fg-2);\n  margin: 0 0 10px 0;\n  padding-bottom: 6px;\n  border-bottom: 1px solid var(--line);\n  display: flex; justify-content: space-between; align-items: baseline;\n}\n.section-title .count{ color: var(--fg-3); font-size: 10px; }\n\n/* Region card */\n.region-card, .zone-card, .spot-card{\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  padding: 12px;\n  margin-bottom: 8px;\n  cursor: pointer;\n  transition: border-color .15s, background .15s;\n  position: relative;\n}\n.region-card:hover, .zone-card:hover, .spot-card:hover{\n  border-color: var(--line-hi);\n  background: var(--bg-2);\n}\n.region-card.detailed::after{\n  content: \"DATOS COMPLETOS\";\n  position: absolute;\n  top: 10px; right: 12px;\n  font-size: 8.5px;\n  color: var(--good);\n  letter-spacing: .18em;\n}\n.region-card .country{\n  font-size: 9.5px;\n  letter-spacing: .2em;\n  color: var(--fg-2);\n  text-transform: uppercase;\n}\n.region-card .name{\n  font-size: 14px;\n  font-weight: 600;\n  letter-spacing: .04em;\n  margin: 4px 0 6px 0;\n  font-family: var(--sans);\n}\n.region-card .headline{\n  font-size: 11px;\n  color: var(--fg-1);\n  margin-bottom: 8px;\n}\n.region-card .meta{\n  display: flex;\n  gap: 14px;\n  font-size: 9.5px;\n  color: var(--fg-2);\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  padding-top: 8px;\n  border-top: 1px dashed var(--line);\n}\n.region-card .meta b{ color: var(--fg-0); font-weight: 600; }\n\n/* Zone card */\n.zone-card{ display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 0; overflow: hidden; }\n.zone-card .stripe{ background: var(--accent); }\n.zone-card .body{ padding: 12px 12px 12px 0; }\n.zone-card .name{ font-size: 12px; font-weight: 600; letter-spacing: .04em; font-family: var(--sans); margin-bottom: 4px; }\n.zone-card .summary{ font-size: 10.5px; color: var(--fg-1); margin-bottom: 8px; }\n.zone-card .kv{ display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 10px; }\n.zone-card .kv .k{ color: var(--fg-2); letter-spacing: .12em; text-transform: uppercase; }\n.zone-card .kv .v{ color: var(--fg-0); }\n.zone-card .footer{\n  margin-top: 8px;\n  padding-top: 6px;\n  border-top: 1px dashed var(--line);\n  font-size: 9.5px;\n  letter-spacing: .15em;\n  text-transform: uppercase;\n  color: var(--fg-2);\n  display: flex; justify-content: space-between;\n}\n.zone-card .footer b{ color: var(--fg-0); font-weight: 600; }\n\n/* Spot list (within zone) */\n.spot-row{\n  display: grid;\n  grid-template-columns: 24px 1fr auto;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 12px;\n  border: 1px solid var(--line);\n  background: var(--bg-0);\n  margin-bottom: 4px;\n  cursor: pointer;\n}\n.spot-row:hover{ border-color: var(--line-hi); background: var(--bg-2); }\n.spot-row.favorited .name::after{\n  content: \"★\"; color: #ffcf4a; margin-left: 6px;\n}\n.spot-row .icon-wrap{\n  width: 18px; height: 18px;\n  display: grid; place-items: center;\n}\n.spot-row .icon{\n  width: 10px; height: 10px;\n  border-radius: 50%;\n  background: var(--accent);\n  border: 1px solid rgba(255,255,255,.6);\n}\n.spot-row .icon.occasional{ background: var(--warn); }\n.spot-row .icon.easter-egg{\n  background: transparent; border: none; color: #ffcf4a;\n  font-size: 14px; display: grid; place-items: center; width: 14px; height: 14px;\n}\n.spot-row .icon.easter-egg::before{ content: \"★\"; }\n.spot-row .name{ font-size: 12px; font-family: var(--sans); font-weight: 500; }\n.spot-row .coords{ font-size: 9px; color: var(--fg-3); letter-spacing: .05em; }\n\n/* Spot detail */\n.spot-header{\n  margin-bottom: 14px;\n}\n.spot-header .name{\n  font-family: var(--sans);\n  font-size: 22px;\n  font-weight: 600;\n  letter-spacing: -.01em;\n  margin: 0;\n  text-wrap: balance;\n}\n.spot-header .sub{\n  display: flex; align-items: center; gap: 10px;\n  margin-top: 4px;\n  font-size: 10px;\n  letter-spacing: .15em;\n  text-transform: uppercase;\n  color: var(--fg-2);\n}\n.spot-header .sub .dot{ width: 3px; height: 3px; background: var(--fg-3); border-radius: 50%; }\n.spot-header .actions{\n  display: flex; gap: 6px;\n  margin-top: 12px;\n}\n.spot-header .btn{\n  font-family: var(--mono);\n  background: var(--bg-0);\n  border: 1px solid var(--line-hi);\n  color: var(--fg-1);\n  padding: 6px 10px;\n  font-size: 10px;\n  letter-spacing: .15em;\n  text-transform: uppercase;\n  cursor: pointer;\n  display: flex; align-items: center; gap: 6px;\n}\n.spot-header .btn:hover{ color: var(--fg-0); border-color: var(--fg-1); }\n.spot-header .btn.fav.active{\n  color: #ffcf4a;\n  border-color: #ffcf4a;\n}\n\n/* Image gallery placeholder */\n.gallery{\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  margin-bottom: 16px;\n}\n.gallery .img{\n  aspect-ratio: 4/3;\n  background:\n    repeating-linear-gradient(45deg, var(--bg-2), var(--bg-2) 6px, var(--bg-3) 6px, var(--bg-3) 12px);\n  border: 1px solid var(--line);\n  position: relative;\n  display: grid; place-items: center;\n  color: var(--fg-3);\n  font-size: 9px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  cursor: pointer;\n  overflow: hidden;\n}\n.gallery .img:hover{ border-color: var(--accent); color: var(--fg-1); }\n.gallery .img.main{ grid-column: span 2; aspect-ratio: 16/9; }\n.gallery .img .up{ text-align: center; line-height: 1.7; pointer-events: none; }\n.gallery .img.filled{\n  background-size: cover;\n  background-position: center;\n  background-repeat: no-repeat;\n  cursor: default;\n}\n.gallery .img.filled:hover{ border-color: var(--line-hi); }\n.gallery .img .img-del{\n  position: absolute; top: 5px; right: 5px;\n  width: 22px; height: 22px;\n  background: rgba(8,14,22,.8);\n  border: 1px solid var(--line-hi);\n  color: var(--fg-0);\n  cursor: pointer; font-size: 11px; line-height: 1;\n  opacity: 0; transition: opacity .15s;\n}\n.gallery .img.filled:hover .img-del{ opacity: 1; }\n.gallery .img .img-tag{\n  position: absolute; left: 0; bottom: 0;\n  background: rgba(8,14,22,.8);\n  padding: 3px 7px; font-size: 8.5px;\n  letter-spacing: .15em; color: var(--fg-1);\n}\n\n/* Badges (wave, bottom, level) */\n.badges{\n  display: flex; flex-wrap: wrap; gap: 4px;\n  margin-bottom: 14px;\n}\n.badge{\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  color: var(--fg-1);\n  padding: 4px 8px;\n  font-size: 9.5px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n}\n.badge .k{ color: var(--fg-3); margin-right: 6px; }\n.badge.level-pro{ border-color: var(--danger); color: #ff8a7a; }\n.badge.level-int{ border-color: var(--warn); color: var(--warn); }\n.badge.level-beg{ border-color: var(--good); color: var(--good); }\n.badge.crowd-high{ border-color: var(--danger); color: #ff8a7a; }\n\n/* Data rows */\n.datasheet{\n  border: 1px solid var(--line);\n  background: var(--bg-0);\n  margin-bottom: 16px;\n}\n.datasheet .row{\n  display: grid;\n  grid-template-columns: 110px 1fr;\n  padding: 9px 12px;\n  border-bottom: 1px solid var(--line);\n  font-size: 11px;\n  gap: 12px;\n}\n.datasheet .row:last-child{ border-bottom: none; }\n.datasheet .row .k{\n  color: var(--fg-2);\n  letter-spacing: .15em;\n  text-transform: uppercase;\n  font-size: 10px;\n  align-self: center;\n}\n.datasheet .row .v{ color: var(--fg-0); }\n\n/* Mock forecast */\n.forecast{\n  border: 1px solid var(--line);\n  background: var(--bg-0);\n  padding: 12px;\n  margin-bottom: 16px;\n}\n.forecast .head{\n  display: flex; justify-content: space-between; align-items: baseline;\n  margin-bottom: 10px;\n}\n.forecast .head .lbl{\n  font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-2);\n}\n.forecast .head .now{\n  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;\n  color: var(--good);\n  display: flex; align-items: center; gap: 6px;\n}\n.forecast .head .now::before{\n  content:\"\"; width: 6px; height: 6px; border-radius: 50%;\n  background: var(--good);\n  box-shadow: 0 0 8px var(--good);\n}\n.forecast-grid{\n  display: grid; grid-template-columns: repeat(5, 1fr);\n  gap: 1px;\n  background: var(--line);\n}\n.forecast-grid .cell{\n  background: var(--bg-1);\n  padding: 8px 6px;\n  text-align: center;\n  display: flex; flex-direction: column;\n  gap: 4px;\n}\n.forecast-grid .cell .day{ font-size: 9px; letter-spacing: .1em; color: var(--fg-2); }\n.forecast-grid .cell .h{ font-size: 16px; font-weight: 600; }\n.forecast-grid .cell .t{ font-size: 9px; color: var(--fg-2); }\n.forecast-grid .cell .wind{ font-size: 9px; color: var(--fg-1); margin-top: 2px; }\n.forecast-grid .cell.now{ background: var(--bg-2); position: relative; }\n.forecast-grid .cell.now::after{\n  content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--good);\n}\n.forecast .disclaimer{\n  margin-top: 8px;\n  font-size: 9px; letter-spacing: .08em;\n  color: var(--fg-3);\n  text-transform: uppercase;\n}\n\n/* Notes */\n.notes{\n  font-size: 11.5px;\n  color: var(--fg-1);\n  line-height: 1.6;\n  border-left: 2px solid var(--accent);\n  padding: 4px 0 4px 10px;\n  margin-bottom: 16px;\n  font-family: var(--sans);\n}\n\n/* Hazards */\n.hazards{\n  border: 1px solid var(--danger);\n  background: rgba(184,58,46,.08);\n  padding: 10px 12px;\n  font-size: 11px;\n  margin-bottom: 16px;\n  display: flex;\n  gap: 10px;\n  align-items: flex-start;\n}\n.hazards .lbl{\n  color: var(--danger);\n  font-size: 10px;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  font-weight: 700;\n  flex-shrink: 0;\n}\n.hazards .text{ color: var(--fg-0); }\n\n/* Empty state */\n.empty{\n  text-align: center;\n  padding: 40px 20px;\n  color: var(--fg-3);\n  font-size: 11px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n.empty .hint{\n  font-family: var(--sans);\n  color: var(--fg-2);\n  font-size: 12px;\n  margin-top: 12px;\n  letter-spacing: normal;\n  text-transform: none;\n}\n\n/* Intro card (world level) */\n.intro{\n  padding: 14px;\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  margin-bottom: 16px;\n}\n.intro .t{\n  font-family: var(--sans);\n  font-size: 16px;\n  font-weight: 600;\n  margin: 0 0 6px 0;\n}\n.intro .d{\n  font-size: 11.5px;\n  color: var(--fg-1);\n  font-family: var(--sans);\n  line-height: 1.5;\n}\n.intro .stats{\n  display: grid; grid-template-columns: repeat(3, 1fr);\n  gap: 1px;\n  background: var(--line);\n  margin-top: 12px;\n}\n.intro .stats .cell{\n  background: var(--bg-1);\n  padding: 8px 10px;\n  text-align: center;\n}\n.intro .stats .cell .n{ font-size: 18px; font-weight: 700; font-family: var(--mono); }\n.intro .stats .cell .l{ font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-2); margin-top: 2px; }\n\n/* Crosshair overlay (visual flair) */\n.crosshair{\n  position: absolute;\n  top: 50%; left: 50%;\n  transform: translate(-50%, -50%);\n  width: 40px; height: 40px;\n  pointer-events: none;\n  z-index: 400;\n  opacity: .25;\n}\n.crosshair::before, .crosshair::after{\n  content: \"\"; position: absolute; background: var(--accent);\n}\n.crosshair::before{ left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-.5px); }\n.crosshair::after{ top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-.5px); }\nbody.sat-mode .crosshair{ opacity: .4; }\nbody.calibrating .crosshair{ display: none; }\n\n/* ============ MAP TOOLBAR (base layer + calibrar) ============ */\n.map-toolbar{\n  position: absolute;\n  top: 76px; left: 18px;\n  z-index: 600;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  align-items: flex-start;\n}\n.map-toolbar .seg{\n  display: flex;\n  background: var(--bg-1);\n  border: 1px solid var(--line);\n  padding: 3px;\n}\n.map-toolbar .seg button{\n  font-family: var(--mono);\n  background: transparent;\n  border: none;\n  color: var(--fg-2);\n  padding: 6px 12px;\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  cursor: pointer;\n}\n.map-toolbar .seg button.active{\n  background: var(--bg-3);\n  color: var(--fg-0);\n}\n.map-toolbar .seg button:hover:not(.active){ color: var(--fg-0); }\n\n.tool-calib{\n  font-family: var(--mono);\n  background: var(--bg-1);\n  border: 1px solid var(--line);\n  color: var(--fg-1);\n  padding: 7px 12px;\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  cursor: pointer;\n  display: flex; align-items: center; gap: 8px;\n}\n.tool-calib:hover{ color: var(--fg-0); border-color: var(--line-hi); }\n.tool-calib.active{\n  background: rgba(255,209,61,.12);\n  border-color: var(--warn);\n  color: var(--warn);\n}\n.tool-calib svg{ flex-shrink: 0; }\n\n/* Botón WIND */\n.tool-wind{\n  font-family: var(--mono);\n  background: var(--bg-1);\n  border: 1px solid var(--line);\n  color: var(--fg-1);\n  padding: 7px 12px;\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  cursor: pointer;\n  display: flex; align-items: center; gap: 8px;\n}\n.tool-wind:hover{ color: var(--fg-0); border-color: var(--line-hi); }\n.tool-wind.active{\n  background: rgba(61,168,255,.14);\n  border-color: var(--accent);\n  color: var(--accent);\n}\n.tool-wind svg{ flex-shrink: 0; }\n\n/* Botones editor (+ Spot, Exportar) */\n.tool-add, .tool-export{\n  font-family: var(--mono);\n  background: var(--bg-1);\n  border: 1px solid var(--line);\n  color: var(--fg-1);\n  padding: 7px 12px;\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  cursor: pointer;\n  text-align: left;\n}\n.tool-add:hover, .tool-export:hover{ color: var(--fg-0); border-color: var(--line-hi); }\n.tool-add.active{\n  background: rgba(61,220,132,.14);\n  border-color: var(--good);\n  color: var(--good);\n}\n\n/* Banner modo añadir */\nbody.adding #map::after{\n  content: \"AÑADIR SPOT · HAZ CLICK EN EL MAPA PARA SITUARLO\";\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  z-index: 580;\n  background: var(--good);\n  color: #05130b;\n  font-family: var(--mono);\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: .18em;\n  text-align: center;\n  padding: 6px;\n  pointer-events: none;\n}\nbody.adding .leaflet-container{ cursor: crosshair; }\n\n/* Botón danger en ficha */\n.spot-header .btn.danger{ border-color: var(--danger); color: #ff8a7a; }\n.spot-header .btn.danger:hover{ background: rgba(184,58,46,.12); color: #ff8a7a; }\n\n/* Formulario nuevo spot */\n.form-box{ width: min(620px, 94vw); }\n.form-grid{\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n  padding: 14px;\n}\n.ff{ display: flex; flex-direction: column; gap: 4px; }\n.ff.ff-wide{ grid-column: span 2; }\n.ff > span{\n  font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-2);\n}\n.ff input, .ff select, .ff textarea{\n  font-family: var(--mono);\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  color: var(--fg-0);\n  padding: 8px 10px;\n  font-size: 12px;\n  outline: none;\n}\n.ff input:focus, .ff select:focus, .ff textarea:focus{ border-color: var(--accent); }\n.ff textarea{ resize: vertical; min-height: 60px; }\n.form-actions{\n  display: flex; gap: 8px;\n  padding: 0 14px 14px;\n}\n.form-actions .calib-btn-copy{ flex: 1; }\n\n/* Overlay de viento en vivo */\n.wind-overlay{\n  position: absolute;\n  inset: 0;\n  z-index: 700;\n  display: none;\n  flex-direction: column;\n  background: var(--bg-0);\n}\n.wind-overlay.visible{ display: flex; }\n.wind-bar{\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  padding: 10px 16px;\n  background: var(--bg-1);\n  border-bottom: 1px solid var(--line);\n  flex-shrink: 0;\n}\n.wind-live{\n  display: flex; align-items: center; gap: 8px;\n  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;\n  font-weight: 700; color: var(--accent);\n}\n.wind-live .wd{\n  width: 7px; height: 7px; border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 8px var(--accent);\n  animation: pulse-live 1.6s infinite;\n}\n@keyframes pulse-live{ 0%,100%{ opacity:1 } 50%{ opacity:.3 } }\n.wind-src{\n  font-size: 10px; letter-spacing: .08em; text-transform: uppercase;\n  color: var(--fg-2);\n}\n.wind-seg{\n  display: flex;\n  border: 1px solid var(--line-hi);\n  background: var(--bg-0);\n}\n.wind-seg button{\n  font-family: var(--mono);\n  background: transparent;\n  border: none;\n  border-right: 1px solid var(--line);\n  color: var(--fg-2);\n  padding: 6px 14px;\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  cursor: pointer;\n}\n.wind-seg button:last-child{ border-right: none; }\n.wind-seg button.active{\n  background: var(--accent);\n  color: #08121d;\n  font-weight: 700;\n}\n.wind-seg button:hover:not(.active){ color: var(--fg-0); background: var(--bg-2); }\n.wind-wf{\n  margin-left: auto;\n  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;\n  color: var(--fg-1);\n  text-decoration: none;\n  border: 1px solid var(--line-hi);\n  padding: 6px 10px;\n}\n.wind-wf:hover{ color: var(--fg-0); border-color: var(--fg-1); }\n.wind-close{\n  font-family: var(--mono);\n  background: var(--bg-0);\n  border: 1px solid var(--line-hi);\n  color: var(--fg-1);\n  padding: 6px 12px;\n  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;\n  cursor: pointer;\n}\n.wind-close:hover{ color: var(--fg-0); border-color: var(--danger); }\n.wind-frame{ flex: 1; position: relative; }\n.wind-frame iframe{ position: absolute; inset: 0; border: none; }\n\n/* Banner cuando se calibra */\nbody.calibrating #map::after{\n  content: \"MODO CALIBRACIÓN · ARRASTRA LOS PINES A SU COORDENADA EXACTA\";\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  z-index: 580;\n  background: var(--warn);\n  color: #1a1200;\n  font-family: var(--mono);\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: .18em;\n  text-align: center;\n  padding: 6px;\n  pointer-events: none;\n}\n/* en calibración los pines tienen cursor de mover */\nbody.calibrating .sm-marker{ cursor: grab; }\nbody.calibrating .sm-marker .label{ opacity: 1; }\nbody.calibrating .leaflet-marker-draggable{ cursor: grab; }\n\n/* ============ PANEL DE CALIBRACIÓN ============ */\n.calib-head{ margin-bottom: 12px; }\n.calib-head .t{\n  font-family: var(--sans);\n  font-size: 16px; font-weight: 600;\n  color: var(--warn);\n  margin-bottom: 4px;\n}\n.calib-head .d{\n  font-size: 11px; color: var(--fg-1);\n  font-family: var(--sans); line-height: 1.5;\n}\n.calib-actions{ display: flex; gap: 6px; margin-bottom: 8px; }\n.calib-btn-copy, .calib-btn-reset{\n  font-family: var(--mono);\n  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;\n  padding: 8px 10px; cursor: pointer;\n}\n.calib-btn-copy{\n  flex: 1;\n  background: var(--warn); border: 1px solid var(--warn); color: #1a1200; font-weight: 700;\n}\n.calib-btn-copy:hover{ background: #ffdb5e; }\n.calib-btn-reset{\n  background: var(--bg-0); border: 1px solid var(--line-hi); color: var(--fg-1);\n}\n.calib-btn-reset:hover{ color: var(--fg-0); border-color: var(--danger); }\n.calib-count{\n  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;\n  color: var(--fg-2); margin-bottom: 12px;\n  padding-bottom: 10px; border-bottom: 1px solid var(--line);\n}\n.calib-count b{ color: var(--warn); }\n.calib-list{ display: flex; flex-direction: column; gap: 2px; }\n.calib-row{\n  display: grid;\n  grid-template-columns: 18px 1fr auto auto;\n  align-items: center; gap: 10px;\n  padding: 8px 10px;\n  background: var(--bg-0);\n  border: 1px solid var(--line);\n  cursor: pointer;\n}\n.calib-row:hover{ border-color: var(--line-hi); background: var(--bg-2); }\n.calib-row.mod{ border-color: var(--warn); background: rgba(255,209,61,.06); }\n.calib-row .ci{ display: grid; place-items: center; }\n.calib-row .cn{ font-size: 11.5px; font-family: var(--sans); }\n.calib-row .cc{ font-size: 9.5px; color: var(--fg-2); letter-spacing: .03em; }\n.calib-row.mod .cc{ color: var(--warn); }\n.calib-row .cok{ font-size: 8.5px; color: var(--fg-3); letter-spacing: .1em; text-transform: uppercase; }\n.calib-row .crev{\n  background: transparent; border: 1px solid var(--line-hi);\n  color: var(--fg-2); width: 18px; height: 18px;\n  cursor: pointer; font-size: 10px; line-height: 1; padding: 0;\n}\n.calib-row .crev:hover{ color: var(--danger); border-color: var(--danger); }\n\n/* ============ EXPORT OVERLAY ============ */\n.export-overlay{\n  position: fixed; inset: 0;\n  z-index: 2000;\n  background: rgba(6,12,18,.8);\n  display: grid; place-items: center;\n}\n.export-box{\n  width: min(560px, 90vw);\n  background: var(--bg-1);\n  border: 1px solid var(--line-hi);\n  box-shadow: 0 20px 60px rgba(0,0,0,.6);\n}\n.export-head{\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 12px 14px;\n  border-bottom: 1px solid var(--line);\n  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;\n  color: var(--fg-0);\n}\n.export-head .export-close{\n  background: transparent; border: 1px solid var(--line-hi);\n  color: var(--fg-1); cursor: pointer; width: 24px; height: 24px;\n}\n.export-head .export-close:hover{ color: var(--fg-0); border-color: var(--fg-1); }\n.export-note{\n  padding: 12px 14px 0;\n  font-size: 11.5px; color: var(--fg-1);\n  font-family: var(--sans); line-height: 1.5; margin: 0;\n}\n.export-ta{\n  width: calc(100% - 28px);\n
